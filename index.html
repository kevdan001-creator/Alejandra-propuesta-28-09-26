<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores para ti 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-fondo: #FBEDEB;
            --color-tinta: #3B2426;
            --color-vino: #7A2E38;
            --color-vino-oscuro: #5F232B;
            --color-oro-rosa: #C97B63;
            --color-corazon-1: #E8646F;
            --color-corazon-2: #C97B63;
            --color-corazon-3: #7A2E38;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        body {
            background: radial-gradient(ellipse at top, #FDF4F1 0%, var(--color-fondo) 55%, #F3DCD6 100%);
            font-family: 'Lora', serif;
            color: var(--color-tinta);
            position: relative;
            overflow-x: hidden;
            padding: clamp(16px, 4vw, 40px) clamp(12px, 3vw, 20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .carta {
            position: relative;
            z-index: 2;
            background: #FFFDFB;
            border-radius: 16px;
            padding: clamp(28px, 5vw, 48px) clamp(18px, 4vw, 36px);
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 30px 60px -20px rgba(122, 46, 56, .25);
            border: 1px solid #EFD9D2;
            margin: auto;
        }

        .adorno {
            font-size: clamp(24px, 5vw, 32px);
            color: var(--color-oro-rosa);
            margin-bottom: 12px;
            letter-spacing: clamp(4px, 2vw, 8px);
        }

        h1 {
            font-family: 'Parisienne', cursive;
            font-weight: 400;
            font-size: clamp(2.4rem, 7vw, 3.8rem);
            color: var(--color-vino);
            margin: 0 0 16px;
            line-height: 1.15;
            word-break: break-word;
        }

        .foto-portada-wrapper {
            margin: 20px 0 24px;
            position: relative;
            display: inline-block;
            width: 100%;
            max-width: 380px;
            background: #fff;
            padding: 10px 10px 18px 10px;
            border-radius: 12px;
            box-shadow: 0 12px 28px -6px rgba(122, 46, 56, 0.18);
            border: 1px solid #F3DCD6;
            transform: rotate(-1.5deg);
            transition: transform 0.3s ease;
        }

        .foto-portada-wrapper:hover {
            transform: rotate(0deg) scale(1.02);
        }

        .foto-portada {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            border-radius: 6px;
            display: block;
        }

        p.mensaje {
            font-size: clamp(1rem, 2.5vw, 1.12rem);
            line-height: 1.7;
            color: #5b4245;
            margin: 0 auto 28px;
            max-width: 42ch;
        }

        .btn-continuar {
            display: inline-block;
            font-family: 'Lora', serif;
            font-size: 1.05rem;
            padding: 14px 32px;
            border-radius: 999px;
            background: var(--color-vino);
            color: #fff;
            text-decoration: none;
            box-shadow: 0 10px 24px -8px rgba(122, 46, 56, 0.55);
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            border: none;
        }

        .btn-continuar:hover {
            background: var(--color-vino-oscuro);
            transform: translateY(-2px);
            box-shadow: 0 14px 28px -6px rgba(122, 46, 56, 0.65);
        }

        .corazon-ambiente {
            position: fixed;
            bottom: -40px;
            opacity: .55;
            animation-name: flotar;
            animation-timing-function: ease-in;
            animation-iteration-count: infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes flotar {
            to {
                transform: translateY(-110vh) translateX(var(--deriva, 0)) rotate(20deg);
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .corazon-ambiente { display: none; }
            .foto-portada-wrapper { transform: none; transition: none; }
        }
    </style>
</head>
<body>

    <div class="carta">
        <div class="adorno">🌸 ♥ 🌸</div>
        <h1>Un detalle especial para ti</h1>
        
        <div class="foto-portada-wrapper">
            <img src="images/portada.jpg" alt="Nuestro momento juntos" class="foto-portada">
        </div>

        <p class="mensaje">
            Estas flores son solo un pequeño reflejo de lo hermosa que haces mi vida. Cada momento contigo es inolvidable y quería sacarte una sonrisa hoy... 
        </p>

        <a href="pregunta.html" class="btn-continuar">Tengo algo más que decirte 💕</a>
    </div>

    <script>
        const coloresCorazon = ['var(--color-corazon-1)', 'var(--color-corazon-2)', 'var(--color-corazon-3)'];

        function crearCorazonAmbiente() {
            const c = document.createElement('div');
            c.className = 'corazon-ambiente';
            c.textContent = '♥';
            c.style.left = Math.random() * 100 + 'vw';
            c.style.fontSize = (12 + Math.random() * 20) + 'px';
            c.style.color = coloresCorazon[Math.floor(Math.random() * coloresCorazon.length)];
            c.style.setProperty('--deriva', (Math.random() * 80 - 40) + 'px');
            const duracion = 6 + Math.random() * 5;
            c.style.animationDuration = duracion + 's';
            document.body.appendChild(c);
            setTimeout(() => c.remove(), duracion * 1000 + 200);
        }

        setInterval(crearCorazonAmbiente, 600);
        crearCorazonAmbiente();
    </script>
</body>
</html>
